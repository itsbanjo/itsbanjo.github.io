name: Validate version.json

on:
  push:
    paths:
      - 'snotshot/version.json'
      - 'tools/validate_version_json.py'
      - '.github/workflows/validate-version.yml'
  pull_request:
    paths:
      - 'snotshot/version.json'
      - 'tools/validate_version_json.py'
      - '.github/workflows/validate-version.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate schema and live App Store version
        run: python3 tools/validate_version_json.py snotshot/version.json --live
      - name: Check the public URL is served as JSON
        run: |
          url="https://itsbanjo.github.io/snotshot/version.json"
          ct=$(curl -fsS -o /dev/null -w '%{content_type}' "$url")
          echo "content-type: $ct"
          case "$ct" in
            application/json*) ;;
            *) echo "unexpected content type: $ct"; exit 1;;
          esac
